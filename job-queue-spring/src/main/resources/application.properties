spring.application.name=job-queue

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:jobqueue}
spring.datasource.username=${POSTGRES_USER:jobqueue}
spring.datasource.password=${POSTGRES_PASSWORD:jobqueue}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

job-queue.kafka.jobs-topic=job-queue.jobs
job-queue.cdc.outbox-topic=job-queue-db.public.job_outbox
