services:
  postgres:
    image: postgres:16
    container_name: job-queue-postgres
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: job-queue-kafka
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9092:9092"       # exposes the PLAINTEXT_HOST listener to your Mac
    environment:
      # KRaft: this node is both a broker AND the controller (single-node dev setup)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Listeners — what addresses Kafka binds to inside the container
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092

      # Advertised listeners — what Kafka tells clients to connect to
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      # Map each listener name to a security protocol (PLAINTEXT = no auth/TLS)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      # Which listener brokers use to talk to each other
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Which listener the KRaft controller uses
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # KRaft quorum: node 1 is the controller, reachable at kafka:29093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      # Fixed cluster ID — must be a base64-encoded UUID, same value every restart
      CLUSTER_ID: "q1Sh9aX2QgmLcg4NB5B1eA"

      # ── topic defaults for a single-node dev cluster ──
      # replication factor 1 = only one copy of each partition (fine for local)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Don't wait before electing a leader (speeds up local startup)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Let the engine create topics automatically when it first publishes
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s   # give Kafka time to elect a leader before health checks start

  kafka-connect:
    image: quay.io/debezium/connect:2.7
    container_name: job-queue-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: job-queue-connect-cluster
      CONFIG_STORAGE_TOPIC: job-queue.connect.configs
      OFFSET_STORAGE_TOPIC: job-queue.connect.offsets
      STATUS_STORAGE_TOPIC: job-queue.connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  connector-init:
    image: curlimages/curl:8.5.0
    container_name: job-queue-connector-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./debezium:/debezium
    entrypoint:
      - curl
      - -sf
      - -X POST
      - http://kafka-connect:8083/connectors
      - -H
      - "Content-Type: application/json"
      - --data-binary
      - "@/debezium/connector-config.json"
    restart: "no"

volumes:
  postgres-data:
  kafka-data:
